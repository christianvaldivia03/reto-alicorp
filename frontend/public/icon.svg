<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: black; }
      .fg { fill: white; stroke: white; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: white; }
      .fg { fill: black; stroke: black; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="37" />
  <!-- Incoming beam: one brand DNA -->
  <line class="fg" x1="16" y1="95" x2="74" y2="95" stroke-width="10" stroke-linecap="round" />
  <!-- Prism -->
  <polygon class="fg" points="90,50 126,118 54,118" fill-opacity="0" stroke-width="10" stroke-linejoin="round" />
  <!-- Refracted fan: many consistent pieces -->
  <line class="fg" x1="114" y1="95" x2="164" y2="72" stroke-width="8" stroke-linecap="round" />
  <line class="fg" x1="114" y1="95" x2="166" y2="96" stroke-width="8" stroke-linecap="round" />
  <line class="fg" x1="114" y1="95" x2="164" y2="120" stroke-width="8" stroke-linecap="round" />
</svg>
